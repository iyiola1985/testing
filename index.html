<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sky Cookie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@500;600&family=Nunito:wght@600;700;800&family=Pacifico&family=Passion+One:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="webgl"></canvas>

    <header class="topbar">
      <a class="brand" href="#top" aria-label="Sky Cookie">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="14" fill="#111" />
            <circle cx="16" cy="16" r="9" fill="#e2b07a" />
            <circle cx="12" cy="13" r="1.4" fill="#3b2112" />
            <circle cx="18.5" cy="12.5" r="1.2" fill="#3b2112" />
            <circle cx="15" cy="18.5" r="1.5" fill="#3b2112" />
            <circle cx="20" cy="18" r="1.1" fill="#3b2112" />
          </svg>
        </span>
        <span class="brand-name">SkyCookie</span>
      </a>
      <div class="topbar-actions">
        <span class="nav-dot" aria-hidden="true"></span>
        <span class="nav-dot" aria-hidden="true"></span>
        <span class="nav-dot" aria-hidden="true"></span>
      </div>
      <button
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="site-nav"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <nav class="nav" id="site-nav" aria-label="Primary">
      <a href="#shop">Shop</a>
      <a href="#cookies">Cookies</a>
      <a href="#about">About</a>
      <a href="#ingredients">Ingredients</a>
    </nav>

    <div class="overlay">
      <h1 class="headline headline-1" aria-label="Sky Cookie">
        <span>S</span><span>k</span><span>y</span>
        <span class="space"></span>
        <span>C</span><span>o</span><span>o</span><span>k</span><span>i</span><span>e</span>
      </h1>
      <h2 class="headline headline-2" aria-label="A bite that floats.">
        <span>A</span>
        <span class="space"></span>
        <span>b</span><span>i</span><span>t</span><span>e</span>
        <span class="space"></span>
        <span>t</span><span>h</span><span>a</span><span>t</span>
        <span class="space"></span>
        <span>f</span><span>l</span><span>o</span><span>a</span><span>t</span><span>s</span><span>.</span>
      </h2>
    </div>

    <div class="scroll-track" aria-hidden="true"></div>

    <section class="ice-cream" id="ice-cream" aria-label="Tech Ice Cream">
      <div class="ice-sticky">
        <header class="tech-bar">
          <a class="tech-logo" href="#ice-cream">
            <span class="tech-logo-name">Tech</span>
            <span class="tech-logo-sub">Ice Cream</span>
          </a>
        </header>

        <canvas id="ice-frames" aria-label="Ingredients forming Tech Ice Cream"></canvas>

        <div class="tech-stage">
          <p class="tech-display" aria-hidden="true"><span>ICE</span><span>CREAM</span></p>
          <div class="tech-product" aria-hidden="true"></div>
          <p class="tech-love">Make With Love</p>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
