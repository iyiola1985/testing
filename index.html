<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Cookie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Passion+One:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="webgl"></canvas>

    <header class="topbar">
      <a class="brand" href="#top" aria-label="Sky Cookie">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="14" fill="#111" />
            <circle cx="16" cy="16" r="9" fill="#e2b07a" />
            <circle cx="12" cy="13" r="1.4" fill="#3b2112" />
            <circle cx="18.5" cy="12.5" r="1.2" fill="#3b2112" />
            <circle cx="15" cy="18.5" r="1.5" fill="#3b2112" />
            <circle cx="20" cy="18" r="1.1" fill="#3b2112" />
          </svg>
        </span>
        <span class="brand-name">SkyCookie</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="#shop">Shop</a>
        <a href="#cookies">Cookies</a>
        <a href="#about">About</a>
        <a href="#ingredients">Ingredients</a>
      </nav>
      <div class="topbar-actions">
        <span class="nav-dot" aria-hidden="true"></span>
        <span class="nav-dot" aria-hidden="true"></span>
        <span class="nav-dot" aria-hidden="true"></span>
      </div>
    </header>

    <div class="overlay">
      <h1 class="headline headline-1" aria-label="Sky Cookie">
        <span>S</span><span>k</span><span>y</span>
        <span class="space"></span>
        <span>C</span><span>o</span><span>o</span><span>k</span><span>i</span><span>e</span>
      </h1>
      <div class="hotspot-stage" aria-label="Cookie highlights">
        <button class="hotspot hotspot-tl" type="button" aria-label="Sea salt">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          </svg>
          <span class="hotspot-label">Sea salt</span>
        </button>
        <button class="hotspot hotspot-tr" type="button" aria-label="Cocoa">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <ellipse cx="12" cy="12" rx="4.6" ry="6.2" fill="currentColor" />
            <path
              d="M12 6c1.5 1.6 2 3.6 1.2 6s-.3 4.4 1.2 6"
              stroke="#111"
              stroke-width="1.5"
              fill="none"
              stroke-linecap="round"
            />
          </svg>
          <span class="hotspot-label">Cocoa</span>
        </button>
        <button class="hotspot hotspot-bl" type="button" aria-label="Vanilla">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.4" fill="currentColor" />
          </svg>
          <span class="hotspot-label">Vanilla</span>
        </button>
        <button class="hotspot hotspot-br" type="button" aria-label="Baked fresh">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13 3 5 14h7l-1 7 8-11h-7l1-7Z" fill="currentColor" />
          </svg>
          <span class="hotspot-label">Baked fresh</span>
        </button>
      </div>
      <h2 class="headline headline-2" aria-label="A bite that floats.">
        <span>A</span>
        <span class="space"></span>
        <span>b</span><span>i</span><span>t</span><span>e</span>
        <span class="space"></span>
        <span>t</span><span>h</span><span>a</span><span>t</span>
        <span class="space"></span>
        <span>f</span><span>l</span><span>o</span><span>a</span><span>t</span><span>s</span><span>.</span>
      </h2>
    </div>

    <div class="scroll-track" aria-hidden="true"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
